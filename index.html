<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenseWay - Conecta Você</title>
    <style>
        /* Variáveis de Cores baseadas nos seus prints */
        :root {
            --gradient-primary: linear-gradient(135deg, #7A71AF, #4A4374);
            --bg-input: #F4F4F4;
            --text-dark: #1A1A1A;
            --text-muted: #666666;
            --link-blue: #0066CC;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Container simulando a tela de um celular */
        .app-container {
            width: 100%;
            max-width: 410px;
            height: 840px;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            background: #fff;
            overflow: hidden;
        }

        /* Elementos Decorativos de Fundo (Bolhas) - Visíveis na Tela 1 */
        .bubble-top {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #A499E2, #5D5296);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.8;
        }

        .bubble-bottom {
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #2D79C7, #15457A);
            border-radius: 50%;
            z-index: 1;
        }

        /* Conteúdo das Telas */
        .screen {
            width: 100%;
            display: none; /* Controlado via JS para alternar */
            flex-direction: column;
            align-items: center;
            z-index: 2;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }

        .logo-box {
            margin-top: 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-box img {
            width: 180px;
            height: auto;
        }

        h1 {
            font-size: 24px;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 50px;
            font-weight: 700;
        }

        /* Componentes de Formulário */
        .form-group {
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 18px;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-input);
            border: 1px solid #A0A0A0;
            border-radius: var(--border-radius);
            font-size: 16px;
            color: var(--text-muted);
            outline: none;
        }

        /* Opções de Radio (Tutor) */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .radio-option input {
            width: 18px;
            height: 18px;
        }

        /* Links Úteis */
        .forgot-password {
            align-self: flex-end;
            color: var(--link-blue);
            text-decoration: none;
            font-size: 14px;
            margin-top: -4px;
            margin-bottom: 40px;
        }

        /* Botões */
        .btn-container {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-top: auto;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 32px;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease;
            text-transform: uppercase;
            min-width: 130px;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(74, 67, 116, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-dark);
            border: 1px solid var(--text-dark);
        }

        .btn-block {
            width: 60%;
            margin-top: auto;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Elementos Visuais de Fundo -->
        <div class="bubble-top" id="topBubble"></div>
        <div class="bubble-bottom" id="bottomBubble"></div>

        <!-- TELA 1: Bem-vindo (Captura de tela 2026-06-18 161712.png) -->
        <div class="screen active" id="screen-welcome">
            <div class="logo-box">
                <!-- Substitua pelo caminho real da sua imagem logo -->
                <img src="logo_senseway.png" alt="SenseWay Logo"> 
            </div>
            <h1>Bem-vindo ao SenseWay!</h1>
            
            <div class="btn-container">
                <button class="btn btn-primary" onclick="navigateTo('screen-login')">Entrar</button>
                <button class="btn btn-secondary" onclick="navigateTo('screen-register')">Cadastrar</button>
            </div>
        </div>

        <!-- TELA 2: Login (Captura de tela 2026-06-18 161719.png) -->
        <div class="screen" id="screen-login">
            <div class="logo-box">
                <img src="logo_senseway.png" alt="SenseWay Logo">
            </div>
            
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" placeholder="Digite aqui...">
            </div>

            <div class="form-group">
                <label>Senha:</label>
                <input type="password" placeholder="Digite aqui...">
            </div>

            <a href="#" class="forgot-password">Esqueceu sua senha?</a>

            <button class="btn btn-primary btn-block">Entrar</button>
        </div>

        <!-- TELA 3: Cadastro (Captura de tela 2026-06-18 161726.png) -->
        <div class="screen" id="screen-register">
            <div class="logo-box" style="margin-top: 10px; margin-bottom: 15px;">
                <img src="logo_senseway.png" style="width: 120px;" alt="SenseWay Logo">
            </div>
            
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" placeholder="Digite aqui...">
            </div>

            <div class="form-group">
                <label>Nome:</label>
                <input type="text" placeholder="Digite aqui...">
            </div>

            <div class="form-group">
                <label>Senha:</label>
                <input type="password" placeholder="Digite aqui...">
            </div>

            <div class="form-group">
                <label>Idade:</label>
                <input type="number" placeholder="Digite aqui...">
            </div>

            <div class="form-group">
                <label>Tutor:</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="tutor" value="sim"> Sim
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="tutor" value="nao"> Não
                    </label>
                </div>
            </div>

            <button class="btn btn-primary btn-block">Cadastrar</button>
        </div>

    </div>

    <!-- Script Simples para Navegação e Ajuste Visual de Background -->
    <script>
        function navigateTo(screenId) {
            // Remove a classe ativa de todas as telas
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            
            // Ativa a tela clicada
            document.getElementById(screenId).classList.add('active');

            // Regra visual: esconder as bolhas de fundo se não for a tela de Boas-Vindas
            const topBubble = document.getElementById('topBubble');
            const bottomBubble = document.getElementById('bottomBubble');
            if (screenId === 'screen-welcome') {
                topBubble.style.display = 'block';
                bottomBubble.style.display = 'block';
            } else {
                topBubble.style.display = 'none';
                bottomBubble.style.display = 'none';
            }
        }
    </script>
</body>
</html>
