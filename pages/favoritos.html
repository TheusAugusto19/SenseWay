<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="Os locais que você salvou.">
    <title>Favoritos | SenseWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="favoritos" data-area="usuario" data-nav="favoritos">
    <main class="container">
        <a href="locais.html" class="link-voltar" data-voltar><span data-icone="seta-esquerda"></span> Voltar</a>

        <div class="topo-pagina">
            <h1>Favoritos</h1>
            <p>Os locais que você salvou, em um só lugar.</p>
        </div>

        <div id="lista-favoritos" class="lista-cartoes" aria-live="polite">
            <p class="carregando">Carregando favoritos...</p>
        </div>

        <!-- Mostrado quando não há favoritos -->
        <section id="favoritos-vazio" class="cartao estado-vazio" hidden>
            <div class="quadrado-icone"><span data-icone="coracao"></span></div>
            <h2>Nenhum favorito ainda!</h2>
            <p class="texto-pequeno">Toque no coração de um local para salvá-lo aqui.</p>
            <p><a href="locais.html" class="btn btn--primario btn--pequeno">Explorar locais</a></p>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
