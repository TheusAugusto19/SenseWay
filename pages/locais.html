<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="Encontre espaços acessíveis e confortáveis.">
    <title>Sugestões de locais | SenseWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="locais" data-area="usuario" data-nav="locais">
    <main class="container">
        <div class="topo-pagina">
            <h1>Sugestões de locais</h1>
            <p>Encontre espaços acessíveis e confortáveis para você se sentir bem em qualquer lugar.</p>
        </div>

        <div class="busca" role="search">
            <span data-icone="busca"></span>
            <label for="busca-locais" class="sr-only">Pesquisar locais</label>
            <input type="search" id="busca-locais" placeholder="Pesquisar locais acessíveis...">
        </div>

        <!-- Os cards são montados pelo js/app.js -->
        <div id="lista-locais" class="grade-locais" aria-live="polite">
            <p class="carregando">Carregando locais...</p>
        </div>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
