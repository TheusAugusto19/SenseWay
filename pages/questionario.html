<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="Personalize suas preferências de acessibilidade.">
    <title>Questionário | SenseWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="questionario" data-area="usuario" data-nav="perfil">
    <main class="container">
        <a href="perfil.html" class="link-voltar" data-voltar><span data-icone="seta-esquerda"></span> Voltar</a>

        <div class="topo-pagina">
            <h1>Questionário</h1>
            <p>Personalize suas preferências de acessibilidade.</p>
        </div>

        <section class="cartao questionario" aria-labelledby="titulo-questionario">
            <h2 id="titulo-questionario">Suas preferências de acessibilidade</h2>
            <p class="texto-suave espaco-abaixo">Responda às perguntas abaixo para personalizar suas sugestões.</p>
            <form id="form-questionario" class="formulario" action="#" method="post">
                <!-- As perguntas vêm do banco (data/questionario.json) -->
                <div id="lista-perguntas" class="lista-perguntas">
                    <p class="carregando">Carregando perguntas...</p>
                </div>
                <p class="mensagem-form" data-mensagem role="alert"></p>
                <button type="submit" class="btn btn--primario btn--largo">Cadastrar</button>
            </form>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
